services:
  pipeline-cron:
    build:
      context: .
      args:
        LEXOID_IMAGE: ${LEXOID_IMAGE:-pdftotex:local}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-}
    image: pdftotex-pipeline:local
    env_file:
      - path: .env
        required: false
    volumes:
      - ${PIPELINE_HOST_ROOT:-./data}:/data
      - ${PDF_INPUT_HOST_DIR:-./data/01-pdf-input}:/input:ro
      - ${OPTIMIZED_TEX_HOST_DIR:-./data/03-review-pending}:/optimized
    command: ["texopt-pipeline", "--once"]
    restart: "no"

  # Optional long-running mode. Crontab deployments normally do not start this.
  pipeline-daemon:
    image: pdftotex-pipeline:local
    env_file:
      - path: .env
        required: false
    volumes:
      - ${PIPELINE_HOST_ROOT:-./data}:/data
      - ${PDF_INPUT_HOST_DIR:-./data/01-pdf-input}:/input:ro
      - ${OPTIMIZED_TEX_HOST_DIR:-./data/03-review-pending}:/optimized
    command: ["texopt-pipeline"]
    restart: unless-stopped
    profiles: ["daemon"]
