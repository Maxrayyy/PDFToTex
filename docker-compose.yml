name: pdftotex

services:
  runtime:
    build:
      context: .
      dockerfile: pipeline/docker/Dockerfile.runtime
      args:
        BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-python:3.10.21-slim-trixie}
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: pdftotex-runtime:local
    profiles: ["build"]

  worker:
    build:
      context: .
      dockerfile: pipeline/docker/Dockerfile.hybrid
      target: runtime
      args:
        BASE_RUNTIME_IMAGE: ${BASE_RUNTIME_IMAGE:-pdftotex-runtime:local}
    image: pdftotex:local
    env_file:
      - Lexoid/.env
      - pipeline/texopt/.env
    environment:
      PDF_SOURCE_ROOT: /input
      PIPELINE_OUTPUT_ROOT: /data
      PIPELINE_PUBLISH_ROOT: ${PIPELINE_PUBLISH_ROOT:-/data/optimized}
      PIPELINE_STAGE_TIMEOUT_SECONDS: ${PIPELINE_STAGE_TIMEOUT_SECONDS:-43200}
      RECOGNITION_OCR: ${RECOGNITION_OCR:-none}
      VISION_CONCURRENCY: ${VISION_CONCURRENCY:-4}
      RECONCILE_CONCURRENCY: ${RECONCILE_CONCURRENCY:-2}
      RENDER_DPI: ${RENDER_DPI:-240}
      RETRY_DPI: ${RETRY_DPI:-480}
      TEXOPT_SEMANTIC_NAMING: ${TEXOPT_SEMANTIC_NAMING:-deferred}
      TEXOPT_NAME_CACHE: ${TEXOPT_NAME_CACHE:-/data/.cache/semantic-names.sqlite3}
      PADDLE_PDX_MODEL_SOURCE: ${PADDLE_PDX_MODEL_SOURCE:-modelscope}
    volumes:
      - ../Downloads:/input:ro
      - ../data:/data
      - ./scripts:/opt/pdftotex:ro
      - paddle-cache:/root/.paddle
      - paddlex-cache:/root/.paddlex
    command: ["texopt-pipeline", "--once"]
    restart: "no"

  tests:
    build:
      context: .
      dockerfile: pipeline/docker/Dockerfile.hybrid
      target: test
      args:
        BASE_RUNTIME_IMAGE: ${BASE_RUNTIME_IMAGE:-pdftotex-runtime:local}
    image: pdftotex-test:local
    network_mode: none
    profiles: ["test"]

volumes:
  paddle-cache:
  paddlex-cache:
    external: true
    name: pdftotex-paddlex-cache
